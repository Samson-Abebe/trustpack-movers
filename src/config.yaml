site:
  name: TrustPack Mover
  site: 'https://www.trustpackmover.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: Rt_4hkAS382sD2Y6t02w6X5fdf_5yBk0fMXYXbkBONc

metadata:
  title:
    default: Trustpack Mover — Safe & Reliable Relocation in Ethiopia
    template: '%s — Trustpack Mover'

  description: 'Professional residential and office moving, premium packing, furniture dismantling, TV mounting, and secure storage in Addis Ababa, Ethiopia.'

  robots:
    index: true
    follow: true

  openGraph:
    site_name: TrustPack Mover
    images:
      - url: 'https://www.trustpackmover.com/og-image.jpg'
        width: 1200
        height: 630
    type: website

  twitter:
    handle: '@trustpackmover'
    site: '@trustpackmover'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"